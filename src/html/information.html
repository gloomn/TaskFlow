<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta author="Lee Ki Joon">
    <link rel="stylesheet" href="../css/mainStyleSheet.css">
    <script defer src="../js//controls/titleBarControl.js"></script>
    <script defer src="../js/controls/menuControl.js"></script>
    <script defer src="../js/settings/themeSwitcher.js"></script>
    <title>TaskFlow</title>
    <script>
        // 초기 테마를 즉시 적용하여 깜빡임 방지
        (function () {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
</head>

<body>
    <div class="main-app">

        <div id="DragWindow" class="title-bar">
            <div class="window-title">
                TASKFLOW
            </div>
            <div class="title-bar-buttons">
                <button id="minimizeWindowButton" class="title-bar-minimize-button" title="Minimize" alt="Minimize Button"></button>
                <button id="resizeWindowButton" class="title-bar-maximize-button" title="Maximize" alt="Maximize/Restore Button"></button>
                <button id="closeWindowButton" class="title-bar-close-button" title="Close" alt="Close Button"></button>
            </div>
        </div>


        <div class ="content-area">
            <div class="side-content">
                <div class="content-menu-list">
                    <p class="button-title">Task</p>
                    <button id="dashboardButton" class="default-menu-button">
                        <img src="../../assets/buttons/sidebar/dashboardButton.svg">
                        <p id="dashboardText">Dashboard</p>
                    </button>
                    <button id="calendarButton" class="default-menu-button">
                        <img src="../../assets/buttons/sidebar/calendarButton.svg">
                        <p id="calendarText">Calendar</p>
                    </button>
                    <button id="timetableButton" class="default-menu-button">
                        <img src="../../assets/buttons/sidebar/timetableButton.svg">
                        <p id="timetableText">Time Table</p> 
                    </button>
                    <button id="documentsButton" class="default-menu-button">
                        <img src="../../assets/buttons/sidebar/documentsButton.svg">
                        <p id="documentsText">Documents</p>
                    </button>
                    <button id="todolistButton" class="default-menu-button">
                        <img src="../../assets/buttons/sidebar/todolistButton.svg">
                        <p id="todolistText">TODO List</p>
                    </button>
                    <p class="button-title">Others</p>
                    <button id="informationButton" class="activated-menu-button">
                        <img src="../../assets/buttons/sidebar/informationButton.svg">
                        <p id="informationText">Information</p> 
                    </button>
                    <button id="licenseButton" class="default-menu-button">
                        <img src="../../assets/buttons/sidebar/licenseButton.svg">
                        <p id="licenseText">License</p> 
                    </button>
                </div>
                    <button id="settingsButton" class="additional-menu-button">
                        <img src="../../assets/buttons/sidebar/settingsButton.svg">
                        <p id="settingsText">Settings</p> 
                    </button>
                <div class="copyright-logo">
                    © 2025 LeeKiJoon all rights reserved
                </div>
            </div>
            <div class="main-content">
                <h1 id="information-title-text">Information</h1>
                <div class="information-title-container">
                    <img class="information-title-iamge" src="../../assets/icons/iconsource/taskFlowIcon.png">
                    <div class="information-title-text">
                        <h1>TASKFLOW</h1>
                        <h2>V.1.0.0 Beta</h2>
                    </div>
                </div>
                <textarea class="text-area" id="informationContentText" readonly disabled>
This program is for task managing.

This program is running on local area.

If you want to move this program to another PC, you should extract the database
and put in your new PC environment.
                </textarea>
            </div>
        </div>
    </div>
</body>

</html>
