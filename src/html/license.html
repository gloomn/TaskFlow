<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta author="Lee Ki Joon">
    <link rel="stylesheet" href="../css/mainStyleSheet.css">
    <script defer src="../js//controls/titleBarControl.js"></script>
    <script defer src="../js/controls/menuControl.js"></script>
    <script defer src="../js/settings/themeSwitcher.js"></script>
    <title>TaskFlow</title>
    <script>
        // 초기 테마를 즉시 적용하여 깜빡임 방지
        (function () {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
</head>

<body>
    <div class="MainApp">

        <div id="DragWindow" class="TitleBar">
            <div class="WindowTitle">
                TASKFLOW
            </div>
            <div class="TitleBarButtons">
                <button id="minimizeWindowButton" class="TitleBarMinimizeButton" title="Minimize" alt="Minimize Button"></button>
                <button id="resizeWindowButton" class="TitleBarMaximizeButton" title="Maximize" alt="Maximize/Restore Button"></button>
                <button id="closeWindowButton" class="TitleBarCloseButton" title="Close" alt="Close Button"></button>
            </div>
        </div>


        <div id="test" class ="ContentArea">
            <div class="SideContent">
                <div class="ContentMenuList">
                    <p class="ButtonTitle" id="taskText">Task</p>
                    <button id="dashboardButton" class="DefaultMenuButton">
                        <img src="../../assets/buttons/sidebar/dashboardButton.svg">
                        <p id="dashboardText">Dashboard</p>
                    </button>
                    <button id="calendarButton" class="DefaultMenuButton">
                        <img src="../../assets/buttons/sidebar/calendarButton.svg">
                        <p id="calendarText">Calendar</p>
                    </button>
                    <button id="timetableButton" class="DefaultMenuButton">
                        <img src="../../assets/buttons/sidebar/timetableButton.svg">
                        <p id="timetableText">Time Table</p> 
                    </button>
                    <button id="documentsButton" class="DefaultMenuButton">
                        <img src="../../assets/buttons/sidebar/documentsButton.svg">
                        <p id="documentsText">Documents</p>
                    </button>
                    <button id="todolistButton" class="DefaultMenuButton">
                        <img src="../../assets/buttons/sidebar/todolistButton.svg">
                        <p id="todolistText">TODO List</p>
                    </button>
                    <p class="ButtonTitle" id="othersText">Others</p>
                    <button id="informationButton" class="DefaultMenuButton">
                        <img src="../../assets/buttons/sidebar/informationButton.svg">
                        <p id="informationText">Information</p> 
                    </button>
                    <button id="licenseButton" class="ActivatedMenuButton">
                        <img src="../../assets/buttons/sidebar/licenseButton.svg">
                        <p id="licenseText">License</p> 
                    </button>
                </div>
                    <button id="settingsButton" class="AdditionalMenuButton">
                        <img src="../../assets/buttons/sidebar/settingsButton.svg">
                        <p id="settingsText">Settings</p> 
                    </button>
                <div class="CopyrightLogo">
                    © 2025 LeeKiJoon all rights reserved
                </div>
            </div>
